<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Preview</title>
    <link rel="stylesheet" href="preview.css">
  </head>
  <body class="preview-page">
    <header class="preview-header">
      <h1>Panel Preview</h1>
      <p id="panelCount">Loading panels...</p>
    </header>

    <main id="gallery" class="preview-grid" aria-live="polite"></main>

    <div id="viewerModal" aria-modal="true" role="dialog" aria-label="Full-size panel viewer">
      <button id="viewerClose" type="button" aria-label="Close viewer">&times;</button>
      <button id="viewerPrev" type="button" aria-label="Previous panel">&larr;</button>
      <img id="viewerImage" alt="Selected panel">
      <button id="viewerNext" type="button" aria-label="Next panel">&rarr;</button>
    </div>

    <footer class="preview-actions">
      <button id="saveAll" type="button">Save All</button>
      <button id="saveAllTrimmed" type="button">Save All (Trim White Space)</button>
    </footer>

    <script src="preview.js"></script>
  </body>
</html>
